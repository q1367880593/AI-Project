<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美剧订阅</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>美剧订阅</h1>
    <p class="subtitle" id="updated-at"></p>
  </header>
  <div class="toolbar">
    <label class="field">状态
      <select id="filter-status">
        <option value="">全部</option>
      </select>
    </label>
    <label class="field">出品方
      <select id="filter-network">
        <option value="">全部</option>
      </select>
    </label>
    <label class="field">排序
      <select id="sort-key">
        <option value="last_air_date">最后更新时间</option>
        <option value="first_air_date">首季播出时间</option>
        <option value="latest_season">最新季播出时间</option>
      </select>
    </label>
    <button id="sort-dir" class="sort-dir" data-dir="desc" title="切换升/降序">↓ 降序</button>
  </div>
  <main id="grid" class="grid"></main>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
