<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影视订阅</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>影视订阅</h1>
    <p class="tagline" id="tagline"></p>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button type="button" class="tab-btn active" data-kind="tv" role="tab" aria-selected="true">剧集</button>
    <button type="button" class="tab-btn" data-kind="movie" role="tab" aria-selected="false">电影</button>
  </nav>
  <script>
    // 首帧渲染前按 URL 修正 Tab 选中态，避免刷新时先显示剧集再跳到电影
    (function () {
      try {
        if (new URLSearchParams(location.search).get("tab") === "movie") {
          var tv = document.querySelector('.tab-btn[data-kind="tv"]');
          var mv = document.querySelector('.tab-btn[data-kind="movie"]');
          tv.classList.remove("active");
          tv.setAttribute("aria-selected", "false");
          mv.classList.add("active");
          mv.setAttribute("aria-selected", "true");
        }
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <div class="searchbar" id="searchbar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="search-input" placeholder="搜索片名 / 中文名（中英文模糊匹配）" autocomplete="off">
    <button type="button" id="search-clear" class="search-clear" title="清空搜索" hidden>×</button>
  </div>
  <div class="toolbar">
    <label class="field" id="status-field">
      <span class="field-label">状态</span>
      <select id="filter-status">
        <option value="">全部</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label">观剧</span>
      <select id="filter-mark">
        <option value="">全部</option>
        <option value="none">未标记</option>
        <option value="unwatched" id="mark-filter-unwatched">未观看</option>
        <option value="finished" id="mark-filter-finished">已追完</option>
        <option value="dropped" id="mark-filter-dropped">已弃剧</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label" id="network-label">出品方</span>
      <select id="filter-network">
        <option value="">全部</option>
      </select>
    </label>
    <label class="field" id="origin-field" hidden>
      <span class="field-label">语言</span>
      <select id="filter-origin">
        <option value="">全部</option>
        <option value="chinese">华语</option>
        <option value="west">欧美</option>
        <option value="japan">日本</option>
        <option value="korea">韩国</option>
        <option value="other">其他</option>
        <option value="unknown">未知</option>
      </select>
    </label>
    <span class="tb-divider"></span>
    <label class="field" id="group-view-field" hidden>
      <span class="field-label">视图</span>
      <select id="group-view">
        <option value="flat">平铺</option>
        <option value="grouped">按分组</option>
      </select>
    </label>
    <label class="field">
      <span class="field-label">排序</span>
      <select id="sort-key">
        <option value="last_air_date">最后更新时间</option>
        <option value="first_air_date">首季播出时间</option>
        <option value="latest_season">最新季播出时间</option>
      </select>
    </label>
    <button id="sort-dir" class="sort-dir" data-dir="desc" title="切换升/降序">
      <svg class="dir-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      <span class="dir-text">降序</span>
    </button>
    <span class="tb-divider"></span>
    <button id="btn-edit" class="tb-btn" title="编辑模式下才能添加 / 删除 / 标记">✎</button>
    <div class="editor-row" id="editor-row" hidden>
      <button id="btn-add" class="tb-btn tb-btn-add" title="手动添加">＋ 添加</button>
      <button id="btn-select-all" class="tb-btn" title="勾选 / 取消勾选当前列表全部电影">全选</button>
      <button id="btn-group" class="tb-btn" title="勾选电影后加入 / 移出分组" hidden>分组</button>
      <button id="btn-batch-mark" class="tb-btn" title="批量标记勾选的电影" hidden>标记</button>
      <button id="btn-import" class="tb-btn tb-btn-add" title="批量粘贴导入（片名或 IMDb 号，每行一条）">导入</button>
      <button id="btn-refresh" class="tb-btn" title="调用 fetch_tv.py 全量抓取（需几分钟）">更新数据</button>
    </div>
    <span class="tb-count" id="result-count"></span>
  </div>
  <main id="grid" class="grid"></main>
  <footer>
    <div class="footer-line"></div>
    <p class="updated-at" id="updated-at"></p>
    <p class="footer-note">数据来源 <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a> · <span id="footer-count"></span></p>
  </footer>
  <div class="overlay" id="add-overlay" hidden>
    <div class="dialog dialog-add" role="dialog" aria-modal="true" aria-labelledby="add-title-label">
      <h2 id="add-title-label">添加剧集</h2>
      <div id="add-view-search">
        <div class="dlg-search">
          <input type="text" id="add-input-title" placeholder="输入剧名搜索，如 Westworld">
          <button type="button" id="add-search-btn" class="tb-btn tb-btn-primary">搜索</button>
        </div>
        <div class="search-hint" id="search-hint">输入剧名后回车或点击搜索</div>
        <div class="search-results" id="search-results"></div>
        <div class="search-manual-toggle">
          <button type="button" id="add-to-manual" class="link-btn">搜索不通？手动输入</button>
        </div>
      </div>
      <div id="add-view-manual" hidden>
        <label class="dlg-field"><span id="add-m-title-label">剧名（英文 / 原文）</span><span class="req">*</span>
          <input type="text" id="add-m-title" placeholder="如 Westworld">
        </label>
        <label class="dlg-field"><span id="add-m-zh-label">中文名（可选）</span>
          <input type="text" id="add-m-zh" placeholder="如 西部世界">
        </label>
        <label class="dlg-field">IMDB 号（可选）
          <input type="text" id="add-m-imdb" placeholder="如 tt0475784">
        </label>
        <div class="dlg-actions">
          <button type="button" id="add-m-back" class="tb-btn">返回搜索</button>
          <button type="button" id="add-m-confirm" class="tb-btn tb-btn-primary">添加</button>
        </div>
      </div>
      <div id="add-view-preview" hidden>
        <div class="preview" id="preview-box"></div>
        <div class="dlg-actions">
          <button type="button" id="add-back" class="tb-btn">返回</button>
          <button type="button" id="add-confirm" class="tb-btn tb-btn-primary">确认添加</button>
        </div>
      </div>
      <div class="dlg-actions">
        <button type="button" id="add-cancel" class="tb-btn">取消</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="mark-overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mark-label">
      <h2 id="mark-label">标记</h2>
      <div class="mark-options">
        <button type="button" class="mark-opt" data-mark="">未标记</button>
        <button type="button" class="mark-opt" data-mark="unwatched" id="mark-opt-unwatched">未观看</button>
        <button type="button" class="mark-opt" data-mark="finished" id="mark-opt-finished">已追完</button>
        <button type="button" class="mark-opt" data-mark="dropped" id="mark-opt-dropped">已弃剧</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="group-overlay" hidden>
    <div class="dialog dialog-group" role="dialog" aria-modal="true" aria-labelledby="group-label">
      <h2 id="group-label">电影分组</h2>
      <p class="group-hint" id="group-hint"></p>
      <label class="dlg-field">输入新组名或搜索已有分组
        <input type="text" id="group-input" placeholder="如 加勒比海盗系列">
      </label>
      <div class="group-list" id="group-list"></div>
      <div class="dlg-actions group-actions">
        <button type="button" id="group-dismiss" class="tb-btn">移出分组</button>
        <button type="button" id="group-cancel" class="tb-btn">取消</button>
        <button type="button" id="group-confirm" class="tb-btn tb-btn-primary">加入</button>
      </div>
    </div>
  </div>
  <div class="overlay" id="confirm-overlay" hidden>
    <div class="dialog dialog-confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p class="confirm-msg" id="confirm-msg"></p>
      <div class="dlg-actions" id="confirm-actions"></div>
    </div>
  </div>
  <div class="overlay" id="import-overlay" hidden>
    <div class="dialog dialog-import" role="dialog" aria-modal="true" aria-labelledby="import-label">
      <h2 id="import-label">批量导入</h2>
      <p class="group-hint">每行一条：片名，或「片名,IMDb号」。Excel 复制的列可直接粘贴。</p>
      <textarea id="import-text" rows="10" spellcheck="false" placeholder="Inception&#10;The Lion King (2019)&#10;Pirates of the Caribbean: Dead Man&#39;s Chest"></textarea>
      <div class="dlg-actions">
        <button type="button" id="import-cancel" class="tb-btn">取消</button>
        <button type="button" id="import-confirm" class="tb-btn tb-btn-primary">导入</button>
      </div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="movies_data.js"></script>
  <script src="app.js"></script>
</body>
</html>
