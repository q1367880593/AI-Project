[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetch-news"
version = "0.1.0"
description = "本地新闻抓取、分析与中文 Markdown 日报工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fetch-news = "fetch_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

