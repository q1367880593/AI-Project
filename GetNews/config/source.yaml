# 搜索源配置

sources:
  google_news_rss:
    enabled: true
    base_url: "https://news.google.com/rss/search"
    params:
      hl: "en-US"
      gl: "US"
      ceid: "US:en"

  newsapi:
    enabled: false
    api_key: ""  # 从环境变量 NEWSAPI_KEY 读取
    base_url: "https://newsapi.org/v2/everything"

  tavily:
    enabled: false
    api_key: ""  # 从环境变量 TAVILY_API_KEY 读取
    base_url: "https://api.tavily.com/search"

  # 本地大模型配置（用于分析和摘要生成）
  llm:
    provider: "ollama"  # ollama 或 openai 兼容接口
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"
    # 若使用 OpenAI 兼容接口:
    # provider: "openai"
    # base_url: "https://api.openai.com/v1"
    # api_key: ""  # 从环境变量 OPENAI_API_KEY 读取
    # model: "gpt-4o-mini"

# 爬虫配置
crawler:
  # 默认使用 Jina Reader（免费，无需本地部署）
  default: "jina"
  jina:
    base_url: "https://r.jina.ai"
  crawl4ai:
    base_url: "http://localhost:11235"  # 本地 Crawl4AI 服务
  firecrawl:
    api_key: ""  # 从环境变量 FIRECRAWL_API_KEY 读取