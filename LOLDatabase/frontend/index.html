<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOL 档案馆</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.loli.net" crossorigin>
<link href="https://fonts.loli.net/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.loli.net/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="errBanner" class="err-banner" hidden></div>
<div class="bg-glow bg-glow-a"></div>
<div class="bg-glow bg-glow-b"></div>
<div class="bg-grid"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">LOL</span>
    <div class="brand-text">
      <h1>档案馆</h1>
      <p>2013 — 至今 · 职业联赛赛事数据终端</p>
    </div>
  </div>
  <div class="stats-chips" id="statsChips">
    <span class="chip skeleton"></span><span class="chip skeleton"></span><span class="chip skeleton"></span><span class="chip skeleton"></span>
  </div>
</header>

<nav class="filters" aria-label="筛选条件">
  <label class="field">
    <span>联赛</span>
    <select id="selScope">
      <option value="">全部</option>
      <option value="LPL">LPL</option>
      <option value="LCK">LCK</option>
      <option value="LEC">LEC</option>
      <option value="LCS">LCS</option>
      <option value="intl">国际赛</option>
    </select>
  </label>
  <label class="field">
    <span>年份</span>
    <select id="selYear"><option value="">全部</option></select>
  </label>
  <label class="field grow">
    <span>赛段</span>
    <select id="selTournament"><option value="">全部赛段</option></select>
  </label>
  <label class="field">
    <span>队伍</span>
    <select id="selTeam"><option value="">全部队伍</option></select>
  </label>
  <label class="field grow">
    <span>选手</span>
    <div class="player-search">
      <input id="playerInput" type="text" placeholder="输入选手 ID / 姓名…" autocomplete="off">
      <div class="player-drop" id="playerDrop" hidden></div>
    </div>
  </label>
  <button class="btn-reset" id="btnReset" title="重置筛选">重置</button>
</nav>

<main class="layout">
  <section class="series-panel" aria-label="系列赛列表">
    <div class="panel-head">
      <h2>系列赛</h2>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div class="series-list" id="seriesList">
      <div class="empty">加载中…</div>
    </div>
    <div class="pager" id="pager" hidden>
      <button id="btnPrev">← 上一页</button>
      <span id="pageInfo"></span>
      <button id="btnNext">下一页 →</button>
    </div>
  </section>

  <aside class="detail-panel glass" id="detailPanel" aria-label="小局明细">
    <div class="empty">
      <div class="empty-symbol">◈</div>
      <p>选择一个系列赛<br>查看小局、BP 与选手数据</p>
    </div>
  </aside>
</main>

<section class="rank-view" id="rankView" hidden>
  <div class="rank-head">
    <button class="back-btn" id="btnRankBack">← 返回赛程</button>
    <h2>选手数据排行</h2>
    <span class="rank-total" id="rankTotal"></span>
  </div>
  <div class="rank-tools">
    <label class="field">
      <span>范围</span>
      <select id="rankScope">
        <option value="">全部</option>
        <option value="LPL">LPL</option>
        <option value="LCK">LCK</option>
        <option value="LEC">LEC</option>
        <option value="LCS">LCS</option>
        <option value="intl">国际赛</option>
      </select>
    </label>
    <label class="field">
      <span>分路</span>
      <select id="rankRole">
        <option value="">全部位置</option>
        <option value="Top">上单</option>
        <option value="Jungle">打野</option>
        <option value="Mid">中单</option>
        <option value="Bot">下路</option>
        <option value="Support">辅助</option>
      </select>
    </label>
    <label class="field">
      <span>最少场次</span>
      <select id="rankMin">
        <option value="10">≥ 10 场</option>
        <option value="30">≥ 30 场</option>
        <option value="50">≥ 50 场</option>
        <option value="100">≥ 100 场</option>
      </select>
    </label>
    <label class="field grow">
      <span>排序维度</span>
      <select id="rankSort"></select>
    </label>
    <button class="order-btn" id="rankOrderBtn" title="切换升降序">↓ 降序</button>
  </div>
  <div class="rank-scroll">
    <table class="rank-table" id="rankTable">
      <tbody><tr><td class="empty" colspan="15">加载中…</td></tr></tbody>
    </table>
  </div>
  <div class="pager" id="rankPager" hidden>
    <button id="rankPrev">← 上一页</button>
    <span id="rankPageInfo"></span>
    <button id="rankNext">下一页 →</button>
  </div>
</section>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal glass" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="data-foot" id="dataFoot">
  <button class="foot-sync" id="btnSync" title="拉取最新数据" aria-label="拉取最新数据">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08a6 6 0 1 1-1.56-5.72L13 11h7V4l-2.35 2.35z"/></svg>
  </button>
  <span class="foot-date" id="footDate">数据更新至 —</span>
</div>

<script src="/app.js"></script>
</body>
</html>
